<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Simulador de Live - v5</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    user-select: none; -webkit-user-select: none;
  }

  .hud {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 2; pointer-events: none;
  }
  .stat {
    background: linear-gradient(180deg, #ffffff, #f1e9ff); color: #333;
    border-radius: 16px; padding: 8px 12px; min-width: 92px; text-align: center;
    box-shadow: 0 4px 0 #444, 0 6px 12px rgba(0,0,0,0.25);
  }
  .stat span { display: block; font-size: 1.4rem; font-weight: bold; }
  .stat small { display: block; font-size: 0.7rem; color: #666; font-weight: normal; }

  #ganho, #aviso, #dica {
    position: fixed; left: 50%; transform: translateX(-50%);
    color: white; background: rgba(20,10,40,0.6); padding: 6px 14px;
    border-radius: 14px; z-index: 2; pointer-events: none;
    width: max-content; max-width: 92vw; text-align: center;
  }
  #ganho { top: 100px; font-size: 0.8rem; }
  #aviso { top: 131px; font-size: 0.9rem; }
  #dica { bottom: 215px; display: none; font-size: 0.95rem; }

  #chat {
    position: fixed; left: 10px; top: 170px; width: min(250px, 46vw);
    background: rgba(20,10,40,0.5); color: white; border-radius: 14px;
    padding: 8px; z-index: 2; font-size: 0.78rem; pointer-events: none;
    box-shadow: 0 6px 14px rgba(0,0,0,0.25);
  }
  #chatTopo { font-weight: bold; margin-bottom: 4px; }
  #chatLinhas { min-height: 110px; }
  #chatLinhas .linha { margin: 3px 0; line-height: 1.25; }
  #chatLinhas .doacao { color: #ffd54a; font-weight: bold; }
  #chatLinhas .voce { color: #9ff3ff; }
  #chatLinhas .sistema { opacity: 0.75; font-style: italic; }
  #respostas { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .resposta {
    pointer-events: auto; font-size: 0.7rem; border: none; border-radius: 10px;
    padding: 5px 7px; background: white; color: #333; cursor: pointer;
    box-shadow: 0 2px 0 #bbb;
  }

  #flutuantes {
    position: fixed; top: 38%; left: 0; width: 100%; height: 0;
    z-index: 3; pointer-events: none;
  }
  .flutuante {
    position: absolute; top: 0; transform: translateX(-50%);
    font-weight: bold; font-size: 1.15rem; white-space: nowrap;
    text-shadow: 2px 2px 0 #000; animation: subir 1.3s ease-out forwards;
  }
  @keyframes subir {
    0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -70px) scale(1.15); }
  }

  #controles {
    position: fixed; bottom: 20px; left: 16px; z-index: 2;
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
  }
  .seta {
    width: 56px; height: 56px; font-size: 1.4rem; border: none; border-radius: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(230,220,255,0.85));
    color: #333; box-shadow: 0 4px 0 #777;
    touch-action: none; cursor: pointer;
  }
  .seta:active { transform: translateY(3px); box-shadow: 0 1px 0 #777; }

  #btnAcao {
    position: fixed; bottom: 30px; right: 20px; width: 100px; height: 100px; z-index: 2;
    border: none; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff19a, #f1c40f 60%, #d4ac0d);
    color: #333; font-size: 1.2rem; font-weight: bold; box-shadow: 0 6px 0 #b7950b;
    touch-action: none; cursor: pointer;
  }
  #btnAcao:active { transform: translateY(4px); box-shadow: 0 2px 0 #b7950b; }

  #btnMini {
    position: fixed; right: 12px; top: 50%; transform: translateY(-50%); z-index: 2;
    border: none; border-radius: 14px;
    background: linear-gradient(180deg, #af7ac5, #8e44ad);
    color: white; font-size: 0.95rem; font-weight: bold; padding: 10px 12px;
    box-shadow: 0 5px 0 #6c3483; cursor: pointer;
  }

  #btnConfig {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 2;
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.9); font-size: 1.5rem;
    box-shadow: 0 4px 0 #777; cursor: pointer;
  }
  #btnConfig:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 #777; }

  .painel-modal {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 5; display: none;
    align-items: center; justify-content: center;
    background: rgba(10,5,25,0.6); padding: 16px;
  }
  .caixa-modal {
    background: white; color: #333; border-radius: 22px; padding: 18px;
    width: 100%; max-width: 760px; max-height: 90vh; overflow-y: auto;
    text-align: center; box-shadow: 0 8px 0 #444, 0 12px 24px rgba(0,0,0,0.35);
    border: 3px solid #ffffff;
  }
  .caixa-modal h2 { margin: 0 0 8px; color: #5b2c6f; }
  #textoCategoria, #mgInfo { font-size: 0.95rem; margin: 6px 0 12px; }
  .tut-texto { font-size: 1.05rem; line-height: 1.4; min-height: 90px; }
  .tut-prog { font-size: 0.8rem; color: #888; margin: 4px 0 0; }
  .cartoes { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .secao { width: 100%; font-weight: bold; font-size: 1.05rem; margin: 14px 0 0; color: #5b2c6f; }
  .cartao {
    width: 210px; background: #f5f0ff; border-radius: 16px;
    padding: 12px; box-shadow: 0 5px 0 #bbb; transition: transform 0.15s;
  }
  .cartao h3 { margin: 0 0 6px; font-size: 1.1rem; }
  .cartao p { margin: 4px 0; font-size: 0.9rem; }
  .cartao p.req { font-weight: bold; color: #8e44ad; }
  .barra { height: 10px; background: #ddd; border-radius: 6px; overflow: hidden; margin: 6px 0; }
  .barra div { height: 100%; width: 100%; background: #2ecc71; transition: width 0.3s; }

  .comprar, .btn-fechar, #btnEncerrar, .btn-secundario, .btn-perigo {
    margin-top: 8px; font-size: 0.95rem; font-weight: bold;
    border: none; border-radius: 12px; padding: 9px 14px; cursor: pointer;
  }
  .comprar {
    color: white; background: linear-gradient(180deg, #5dade2, #2e86c1);
    box-shadow: 0 4px 0 #21618c;
  }
  .comprar:disabled {
    background: linear-gradient(180deg, #bbb, #999); box-shadow: 0 4px 0 #666; cursor: not-allowed;
  }
  .btn-fechar {
    margin-top: 16px; font-size: 1.05rem; padding: 12px 28px; color: white;
    background: #7f8c8d; box-shadow: 0 5px 0 #566061;
  }
  #btnEncerrar {
    display: none; margin-top: 14px; color: white;
    background: linear-gradient(180deg, #ec7063, #c0392b); box-shadow: 0 4px 0 #922b21;
  }
  .btn-secundario {
    color: #333; background: #ecf0f1; box-shadow: 0 4px 0 #bdc3c7;
  }
  .btn-perigo {
    margin-top: 16px; color: white; background: #c0392b; box-shadow: 0 4px 0 #922b21;
  }

  @media (hover: hover) {
    .cartao:hover { transform: translateY(-2px); }
    .comprar:hover:not(:disabled), .btn-fechar:hover, .btn-secundario:hover, .btn-perigo:hover {
      filter: brightness(1.08);
    }
  }

  #mgArea {
    position: relative; width: 100%; height: 300px; overflow: hidden;
    background: linear-gradient(#bfe9ff, #e8f8ff); border-radius: 16px;
    margin: 10px 0; touch-action: none;
  }
  .item-mg {
    position: absolute; font-size: 2rem; transform: translateX(-50%);
    cursor: pointer; user-select: none;
  }
  .alvo-mg {
    position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px;
    border-radius: 50%; background: #e74c3c; color: white; font-size: 1.8rem;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 5px 0 #922b21; cursor: pointer;
  }
</style>

</head>

</div>

<button id="btnAcao">AÇÃO</button>
<button id="btnMini">🎮 Minigames</button>
<button id="btnConfig" title="Configurações">⚙️</button>

<div class="painel-modal" id="lojaPainel">
  <div class="caixa-modal">
    <h2>🛒 Loja</h2>
    <div class="cartoes" id="cartoes"></div>
    <button class="btn-fechar" data-fechar>Fechar loja</button>
  </div>
</div>

<div class="painel-modal" id="categoriaPainel">

    <br>
    <button class="btn-fechar" data-fechar>Fechar</button>
  </div>
</div>

<div class="painel-modal" id="minigamePainel">

    <h2>🎮 Minigames</h2>

    <div class="cartoes">

      <button class="comprar" id="mgAlvo">🎯 Toque no alvo (15 s)</button>
    </div>
    <button class="btn-fechar" data-fechar>Fechar</button>
  </div>
</div>

<div class="painel-modal" id="tutorialPainel">
  <div class="caixa-modal">
    <h2 id="tutTitulo"></h2>
    <p id="tutTexto" class="tut-texto"></p>
    <p id="tutProgresso" class="tut-prog"></p>
    <div class="cartoes">
      <button class="btn-secundario" id="tutPular">Pular</button>
      <button class="comprar" id="tutProximo">Próximo</button>
    </div>
  </div>
</div>

<div class="painel-modal" id="configPainel">
  <div class="caixa-modal">
    <h2>⚙️ Configurações</h2>
    <p>Seu progresso é salvo automaticamente neste navegador.</p>

      <button class="comprar" id="btnSom">🔊 Som: ligado</button>
      <button class="comprar" id="btnVerTutorial">📖 Ver tutorial</button>
    </div>
    <button class="btn-perigo" id="btnApagar">🗑️ Apagar progresso</button>
    <br>
    <button class="btn-fechar" data-fechar>Fechar</button>
  </div>
</div>

  function garantirAudio() {
    if (!audioCtx) {

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        audioCtx = null;
      }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  window.addEventListener("pointerdown", garantirAudio);
  window.addEventListener("keydown", garantirAudio);

    const t0 = audioCtx.currentTime + (atraso || 0);
    const osc = audioCtx.createOscillator();
    const ganho = audioCtx.createGain();
    osc.type = tipo;
    osc.frequency.setValueAtTime(freq, t0);
    ganho.gain.setValueAtTime(volume, t0);
    ganho.gain.exponentialRampToValueAtTime(0.0001, t0 + duracao);
    osc.connect(ganho);
    ganho.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duracao + 0.02);
  }

        posX: posJog.x,
        posZ: posJog.z,
        yaw: yaw
      };
      localStorage.setItem(CHAVE_SAVE, JSON.stringify(dados));
    } catch (e) {
      // Sem armazenamento disponível: o jogo continua, só não salva
    }

  function carregarJogo() {
    let dados = null;
    try {
      dados = JSON.parse(localStorage.getItem(CHAVE_SAVE));
    } catch (e) {
      dados = null;
    }
    if (!dados) return false;

    seguidores = Number(dados.seguidores) || 0;
    moedas = Number(dados.moedas) || 0;
    nivelRegistrado = Number(dados.nivelRegistrado) || 1;
    tutorialVisto = !!dados.tutorialVisto;
    somLigado = dados.somLigado !== false;
    yaw = Number(dados.yaw) || 0;

    if (dados.equip) {
      for (const k in equipamentos) {
        equipamentos[k].nivel = Math.min(equipamentos[k].nivelMax, Number(dados.equip[k]) || 0);
      }
    }
    if (dados.cenariosComprados) cenariosComprados = dados.cenariosComprados;

    if (dados.temCasa) {
      temCasa = true;
      casaJogador.visible = true;
      mesa.visible = true;
      loteGroup.visible = false;
      adicionarObstaculosCasa();
    }

    if (typeof dados.posX === "number" && typeof dados.posZ === "number") {
      posJog.x = Math.max(-72, Math.min(72, dados.posX));
      posJog.z = Math.max(-58, Math.min(58, dados.posZ));
    }

    cenarioAtual = dados.cenarioAtual && cenarios[dados.cenarioAtual] ? dados.cenarioAtual : "padrao";
    desenharEquipamentos();
    return true;
  }

  function efeitoPatrocinio() {
    if (!patrocinioAtivo) return { multMoeda: 1, bonusSeg: 0, bonusMoeda: 0 };
    const p = patrocinios[patrocinioAtivo.chave];
    return {
      multMoeda: p.multMoeda || 1,
      bonusSeg: p.bonusSeg || 0,
      bonusMoeda: p.bonusMoeda || 0
    };
  }

  // ===== Cálculos =====
  function custoDo(item) {
    return item.precoBase * (item.nivel + 1);
  }

  function fatorPublico(chave) {
    return 0.4 + 0.6 * (categorias[chave].interesse / 100);
  }

  function sorteio(lista) {
    return lista[Math.floor(Math.random() * lista.length)];

  function dentroDaCasa() {
    return temCasa && Math.abs(posJog.x - HX) < 4.8 && Math.abs(posJog.z - HZ) < 3.8;

    return dentroDaCasa() ? "casa" : "rua";
  }

  function calcularGanho() {
    let seguidoresBase;
    let moedasBase;

    if (localAtual() === "casa") {
      seguidoresBase = 1 + equipamentos.camera.nivel + equipamentos.luz.nivel + equipamentos.computador.nivel * 2;
      moedasBase = 2 + equipamentos.microfone.nivel * 2 + equipamentos.luz.nivel + equipamentos.teclado.nivel;
    } else {
      seguidoresBase = 1;
      moedasBase = 2;
    }

    const bonusNivel = 1 + 0.05 * (nivelAtual().nivel - 1);
    const e = efeitoPatrocinio();

    if (!tipoAtual) {
      return {
        seguidores: Math.round(seguidoresBase * bonusNivel) + e.bonusSeg,
        moedas: Math.round(moedasBase * bonusNivel * e.multMoeda) + e.bonusMoeda
      };
    }

    const c = categorias[tipoAtual];
    const f = fatorPublico(tipoAtual);
    const segBase = Math.max(1, Math.round(seguidoresBase * c.multSeg * f * bonusNivel));
    const moedaBase = Math.max(1, Math.round(moedasBase * c.multMoeda * f * bonusNivel));
    return {
      seguidores: segBase + e.bonusSeg,
      moedas: Math.round(moedaBase * e.multMoeda) + e.bonusMoeda
    };
  }

    adicionarObstaculo(HX + 3.1, HZ + 4, 1.9, 0.2);    // frente, outro lado da porta
    adicionarObstaculo(MESA_X, MESA_Z, 2.25, 1.25);    // mesa
    adicionarObstaculo(HX + 3.8, HZ + 0.8, 0.55, 1.2); // sofá
  }

  function aplicarCenario(chave) {
    const c = cenarios[chave];
    cenarioAtual = chave;
    matParede.color.set(c.parede);
    matPiso.color.set(c.piso);

      faixaNeon.material.color.set(c.neon);
      faixaNeon.material.emissive.set(c.neon);
    }
  }

  // ===== Movimento =====
  function bloqueado(x, z) {
    for (const o of obstaculos) {
      if (x > o.minX - RAIO && x < o.maxX + RAIO && z > o.minZ - RAIO && z < o.maxZ + RAIO) {
        return true;
      }
    }
    return false;
  }

  function direcaoEntrada() {
    // ix: direita (+) / esquerda (-)   iy: frente (+) / trás (-)
    let ix = 0;
    let iy = 0;
    if (teclas["w"] || teclas["arrowup"] || controle.cima) iy += 1;
    if (teclas["s"] || teclas["arrowdown"] || controle.baixo) iy -= 1;
    if (teclas["a"] || controle.esquerda) ix -= 1;
    if (teclas["d"] || controle.direita) ix += 1;
    return [ix, iy];
  }

  function moverJogador(dt) {
    // Setas ← → do teclado também giram a câmera
    if (teclas["arrowleft"]) yaw += GIRO * dt;
    if (teclas["arrowright"]) yaw -= GIRO * dt;

    const [ix, iy] = direcaoEntrada();
    if (ix === 0 && iy === 0) return false;

    // Movimento relativo à câmera: "frente" é para onde a câmera olha
    const tamanho = Math.hypot(ix, iy);
    const fx = -Math.sin(yaw);
    const fz = -Math.cos(yaw);
    const rx = Math.cos(yaw);
    const rz = -Math.sin(yaw);
    const mx = (fx * iy + rx * ix) / tamanho;
    const mz = (fz * iy + rz * ix) / tamanho;

    const passo = VELOCIDADE * dt;
    const novoX = posJog.x + mx * passo;
    if (!bloqueado(novoX, posJog.z)) posJog.x = novoX;
    const novoZ = posJog.z + mz * passo;
    if (!bloqueado(posJog.x, novoZ)) posJog.z = novoZ;

    jogador.grupo.rotation.y = Math.atan2(mx, mz);

    posJog.x = Math.max(-72, Math.min(72, posJog.x));
    posJog.z = Math.max(-58, Math.min(58, posJog.z));
    return true;
  }

  function animarBoneco(b, andando, t) {
    const balanco = andando ? Math.sin(t * 10) * 0.7 : 0;
    b.pernaE.rotation.x = balanco;
    b.pernaD.rotation.x = -balanco;
    b.bracoE.rotation.x = -balanco;
    b.bracoD.rotation.x = balanco;
  }

  function atualizarCamera(dt) {
    const k = Math.min(1, dt * 10);
    const alvoX = posJog.x + Math.sin(yaw) * DISTANCIA;
    const alvoZ = posJog.z + Math.cos(yaw) * DISTANCIA;
    camera.position.x += (alvoX - camera.position.x) * k;
    camera.position.y += (7 - camera.position.y) * k;
    camera.position.z += (alvoZ - camera.position.z) * k;
    camera.lookAt(posJog.x, 1.5, posJog.z);
  }

  // ===== Zonas de interação =====
  function atualizarZona() {
    if (modalAtual) {
      dica.style.display = "none";
      return;
    }

    const dLoja = Math.hypot(posJog.x - LOJA_X, posJog.z - LOJA_Z);
    zonaAtual = dLoja < 3.5 ? "loja" : "outro";

    let texto;
    if (zonaAtual === "loja") {
      texto = "Toque em AÇÃO para abrir a loja";
    } else if (aoVivo) {
      texto = "Toque em AÇÃO para mudar o tipo ou encerrar a live";
    } else if (dentroDaCasa()) {
      texto = "Você está em casa! Toque em AÇÃO para começar a live";
    } else {
      texto = "Você está na rua. Toque em AÇÃO para uma live com o celular";
    }

    dica.textContent = texto;
    dica.style.display = "block";
  }

  // ===== Live =====
  function iniciarLive() {
    aoVivo = true;
    intervalo = setInterval(tick, 3000);
    telaMonitor.material.color.set(0xe74c3c);
    mostrarAviso("Você está ao vivo! 🔴 Pode andar enquanto a live roda.");
    adicionarChat(`🔴 Live começou: ${categorias[tipoAtual].nome}`, "sistema");
    tocar("live");
  }

  function pararLive() {
    aoVivo = false;
    clearInterval(intervalo);
    telaMonitor.material.color.set(0x3498db);
    mostrarAviso("Live encerrada. Volte à loja para comprar equipamentos!");
    adicionarChat("⏹ Live encerrada", "sistema");
  }

  function tick() {
    // Cansaço do público (o Zoom deixa o público se cansar mais rápido)
    const patr = patrocinioAtivo ? patrocinios[patrocinioAtivo.chave] : null;
    const desgaste = 3 * (patr && patr.cansaco ? patr.cansaco : 1);
    for (const chave in categorias) {
      const c = categorias[chave];
      if (chave === tipoAtual) {
        c.interesse = Math.max(30, c.interesse - desgaste);
      } else {
        c.interesse = Math.min(100, c.interesse + 1);
      }
    }

    const g = calcularGanho();
    seguidores += g.seguidores;
    moedas += g.moedas;
    flutuar(`+${g.seguidores} 👥  +${g.moedas} 🪙`, "#ffffff");

    // Patrocínio: conta um ciclo
    if (patrocinioAtivo) {
      patrocinioAtivo.ciclos -= 1;
      if (patrocinioAtivo.ciclos <= 0) {
        adicionarChat(`🤝 Patrocínio terminou: ${patr.nome}`, "sistema");
        patrocinioAtivo = null;
      }
    }

    chatMensagemAleatoria();
    if (Math.random() < 0.25) chatEntrada();
    if (Math.random() < 0.3 + (tipoAtual === "conversa" ? 0.15 : 0)) doacao();

    atualizarHUD();
  }

  function escolherCategoria(chave) {
    const jaAoVivo = aoVivo;
    tipoAtual = chave;

    if (!jaAoVivo) {
      iniciarLive();

      mostrarAviso(`Agora a live é de ${categorias[chave].nome}!`);
      adicionarChat(`🔄 Mudou o tipo para ${categorias[chave].nome}`, "sistema");

    fecharModal();
    atualizarHUD();
  }

  function criarCartao(html) {

    div.innerHTML = html;
    cartoesLojaEl.appendChild(div);
    return div;

  function criarCartoesLoja() {
    // Casa e equipamentos
    criarSecao("🏠 Casa e equipamentos");

    const divCasa = criarCartao(`
      <h3>🏠 Casa</h3>
      <p>Terreno com casa. Os equipamentos só funcionam dentro dela.</p>
      <p class="nivel"></p>
      <button class="comprar"></button>`);
    const botaoCasa = divCasa.querySelector(".comprar");
    botaoCasa.addEventListener("click", comprarCasa);
    cartoesLoja.casa = { nivel: divCasa.querySelector(".nivel"), botao: botaoCasa };

    for (const chave in equipamentos) {
      const div = criarCartao(`
        <h3>${equipamentos[chave].nome}</h3>
        <p>${equipamentos[chave].descricao}</p>
        <p class="nivel"></p>
        <button class="comprar"></button>`);
      const botao = div.querySelector(".comprar");
      botao.addEventListener("click", () => comprar(chave));
      cartoesLoja[chave] = { nivel: div.querySelector(".nivel"), botao: botao };
    }

    // Cenários
    criarSecao("🎨 Cenários da casa");
    for (const chave in cenarios) {
      const div = criarCartao(`
        <h3>${cenarios[chave].nome}</h3>
        <p class="req"></p>
        <button class="comprar"></button>`);
      const botao = div.querySelector(".comprar");
      botao.addEventListener("click", () => comprarCenario(chave));
      cartoesLoja["c_" + chave] = { req: div.querySelector(".req"), botao: botao };
    }

    // Patrocínios
    criarSecao("🤝 Patrocínios (ganhos extras por alguns ciclos)");
    for (const chave in patrocinios) {
      const p = patrocinios[chave];
      const div = criarCartao(`
        <h3>${p.nome}</h3>
        <p>${p.descricao}</p>
        <p class="req"></p>
        <button class="comprar"></button>`);
      const botao = div.querySelector(".comprar");
      botao.addEventListener("click", () => contratarPatrocinio(chave));
      cartoesLoja["p_" + chave] = { req: div.querySelector(".req"), botao: botao };
    }
  }

  function atualizarLoja() {
    const nivelOk = (min) => nivelAtual().nivel >= min;

    // Casa
    const casaRef = cartoesLoja.casa;
    casaRef.nivel.textContent = temCasa ? "Você já tem casa ✅" : "Terreno à venda";
    casaRef.botao.textContent = temCasa ? "Comprada" : `Comprar por ${PRECO_CASA} moedas`;
    casaRef.botao.disabled = temCasa || moedas < PRECO_CASA;

    // Equipamentos
    for (const chave in equipamentos) {
      const item = equipamentos[chave];
      const ref = cartoesLoja[chave];
      const maximo = item.nivel >= item.nivelMax;
      const custo = custoDo(item);

      ref.nivel.textContent = `Nível: ${item.nivel} / ${item.nivelMax}`;
      if (!temCasa) {
        ref.botao.textContent = "Precisa de casa primeiro";
        ref.botao.disabled = true;
      } else {
        ref.botao.textContent = maximo ? "Nível máximo" : `Comprar por ${custo} moedas`;
        ref.botao.disabled = maximo || moedas < custo;
      }
    }

    // Cenários
    for (const chave in cenarios) {
      const c = cenarios[chave];
      const ref = cartoesLoja["c_" + chave];
      ref.req.textContent = `Requer nível ${c.nivelMin} · ${c.preco ? "Preço: " + c.preco + " moedas" : "Grátis"}`;

      if (cenarioAtual === chave) {
        ref.botao.textContent = "Em uso";
        ref.botao.disabled = true;
      } else if (!temCasa) {
        ref.botao.textContent = "Precisa de casa primeiro";
        ref.botao.disabled = true;
      } else if (!nivelOk(c.nivelMin)) {
        ref.botao.textContent = "Bloqueado";
        ref.botao.disabled = true;
      } else if (cenariosComprados[chave]) {
        ref.botao.textContent = "Usar este";
        ref.botao.disabled = false;
      } else {
        ref.botao.textContent = `Comprar por ${c.preco} moedas`;
        ref.botao.disabled = moedas < c.preco;
      }
    }

    // Patrocínios
    for (const chave in patrocinios) {
      const p = patrocinios[chave];
      const ref = cartoesLoja["p_" + chave];
      ref.req.textContent = `Requer nível ${p.nivelMin} · Paga ${p.pagamento} moedas`;

      if (patrocinioAtivo && patrocinioAtivo.chave === chave) {
        ref.botao.textContent = `Ativo: ${patrocinioAtivo.ciclos} ciclos restantes`;
        ref.botao.disabled = true;
      } else if (patrocinioAtivo) {
        ref.botao.textContent = "Já tem um patrocínio ativo";
        ref.botao.disabled = true;
      } else if (!nivelOk(p.nivelMin)) {
        ref.botao.textContent = "Bloqueado";
        ref.botao.disabled = true;
      } else {
        ref.botao.textContent = `Aceitar por ${p.pagamento} moedas`;
        ref.botao.disabled = moedas < p.pagamento;
      }
    }
  }

  function comprarCasa() {
    if (temCasa || moedas < PRECO_CASA) return;

    moedas -= PRECO_CASA;
    temCasa = true;
    casaJogador.visible = true;
    mesa.visible = true;
    loteGroup.visible = false;
    adicionarObstaculosCasa();
    tocar("compra");
    mostrarAviso("Você comprou sua casa! 🏠 Entre pela porta e monte seu estúdio.");
    adicionarChat("🏠 Você se mudou para a casa nova!", "sistema");
    salvarJogo();
    atualizarHUD();
  }

  function comprar(chave) {
    const item = equipamentos[chave];
    const custo = custoDo(item);
    if (!temCasa || item.nivel >= item.nivelMax || moedas < custo) return;

    moedas -= custo;
    item.nivel += 1;
    desenharEquipamentos();
    tocar("compra");
    mostrarAviso(`${item.nome} melhorou para o nível ${item.nivel}!`);
    salvarJogo();
    atualizarHUD();
  }

  function comprarCenario(chave) {
    const c = cenarios[chave];
    if (!temCasa || nivelAtual().nivel < c.nivelMin) return;

    if (!cenariosComprados[chave]) {
      if (moedas < c.preco) return;
      moedas -= c.preco;
      cenariosComprados[chave] = true;
      tocar("compra");
    } else {
      tocar("clique");
    }
    aplicarCenario(chave);
    mostrarAviso(`Cenário ${c.nome} aplicado na sua casa!`);
    salvarJogo();
    atualizarHUD();
  }

  function contratarPatrocinio(chave) {
    const p = patrocinios[chave];
    if (patrocinioAtivo || nivelAtual().nivel < p.nivelMin || moedas < p.pagamento) return;

    moedas -= p.pagamento;
    patrocinioAtivo = { chave: chave, ciclos: p.duracao };
    tocar("compra");
    mostrarAviso(`Patrocínio ativo: ${p.nome} por ${p.duracao} ciclos!`);
    adicionarChat(`🤝 Patrocínio fechado: ${p.nome}`, "sistema");
    salvarJogo();
    atualizarHUD();
  }

  function desenharEquipamentos() {
    equipCamera.visible = equipamentos.camera.nivel > 0;
    equipMicrofone.visible = equipamentos.microfone.nivel > 0;
    equipLed.visible = equipamentos.luz.nivel > 0;
    equipTeclado.visible = equipamentos.teclado.nivel > 0;
    equipComputador.visible = equipamentos.computador.nivel > 0;
  }

    const nome = minigameAtivo === "moedas" ? "Pega-moedas" : "Toque no alvo";
    mgInfo.textContent = `${nome} · Tempo: ${mgTempo}s · Pontos: ${mgPontos}`;

  function limparTimersMini() {
    clearInterval(mgTimer);
    clearInterval(mgSpawn);
    clearInterval(mgMove);

    mgSpawn = null;
    mgMove = null;
  }

  function iniciarMinigame(tipo) {
    limparTimersMini();
    minigameAtivo = tipo;
    mgPontos = 0;
    mgGanhos = 0;
    mgTempo = tipo === "moedas" ? 20 : 15;
    mgArea.innerHTML = "";
    atualizarMinigameInfo();
    atualizarBotoesMini();

    mgTimer = setInterval(() => {
      mgTempo -= 1;
      atualizarMinigameInfo();
      if (mgTempo <= 0) finalizarMinigame();
    }, 1000);

    if (tipo === "moedas") {
      mgSpawn = setInterval(spawnMoeda, 600);
      mgMove = setInterval(moverMoedas, 30);
    } else {
      mgSpawn = setInterval(spawnAlvo, 800);
    }
  }

  function pararMinigame() {
    limparTimersMini();
    minigameAtivo = null;
    mgArea.innerHTML = "";
    atualizarBotoesMini();
  }

  function finalizarMinigame() {
    const tipo = minigameAtivo;
    limparTimersMini();
    minigameAtivo = null;
    mgArea.innerHTML = "";
    mgInfo.textContent = tipo === "moedas"
      ? `Fim! Você pegou ${mgPontos} moedas e ganhou ${mgGanhos} moedas.`
      : `Fim! Você acertou ${mgPontos} alvos e ganhou ${mgGanhos} seguidores.`;
    atualizarBotoesMini();
    atualizarHUD();
  }

  function spawnMoeda() {
    const moeda = document.createElement("div");
    moeda.className = "item-mg";
    moeda.textContent = "🪙";
    moeda.style.left = (5 + Math.random() * 90) + "%";
    moeda.style.top = "-40px";
    moeda.dataset.y = "-40";
    moeda.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      coletarMoeda(moeda);
    });
    mgArea.appendChild(moeda);
  }

  function moverMoedas() {
    const altura = mgArea.clientHeight;
    for (const moeda of mgArea.querySelectorAll(".item-mg")) {
      const y = parseFloat(moeda.dataset.y) + 4;
      moeda.dataset.y = y;
      moeda.style.top = y + "px";
      if (y > altura) moeda.remove();
    }
  }

  function coletarMoeda(moeda) {
    if (minigameAtivo !== "moedas") return;
    const recompensa = 3 + equipamentos.teclado.nivel;
    mgPontos += 1;
    mgGanhos += recompensa;
    moedas += recompensa;
    tocar("moeda");
    moeda.remove();
    atualizarMinigameInfo();
    atualizarHUD();
  }

  function spawnAlvo() {
    const alvo = document.createElement("div");
    alvo.className = "alvo-mg";
    alvo.textContent = "🎯";
    alvo.style.left = (10 + Math.random() * 80) + "%";
    alvo.style.top = (15 + Math.random() * 70) + "%";
    alvo.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      acertarAlvo(alvo);
    });
    mgArea.appendChild(alvo);
    setTimeout(() => alvo.remove(), 1000);
  }

  function acertarAlvo(alvo) {
    if (minigameAtivo !== "alvo") return;
    mgPontos += 1;
    mgGanhos += 1;
    seguidores += 1;
    tocar("seguidor");
    alvo.remove();
    atualizarMinigameInfo();
    atualizarHUD();
  }

  mgMoedasBtn.addEventListener("click", () => iniciarMinigame("moedas"));
  mgAlvoBtn.addEventListener("click", () => iniciarMinigame("alvo"));
  btnMini.addEventListener("click", () => {
    if (!modalAtual) {
      tocar("clique");
      abrirModal("minigamePainel");
    }
  });

  // ===== HUD =====
  function atualizarTextoGanho() {
    if (tipoAtual) {
      const g = calcularGanho();
      const pct = Math.round(categorias[tipoAtual].interesse);
      const local = localAtual() === "casa" ? "🏠 Casa" : "📱 Rua";
      const pat = patrocinioAtivo ? ` · 🤝 ${patrocinios[patrocinioAtivo.chave].nome}` : "";
      elGanho.textContent =
        `${categorias[tipoAtual].nome} · ${local} · Público ${pct}% · +${g.seguidores} seguidores e +${g.moedas} moedas por ciclo${pat}`;
    } else {
      elGanho.textContent = "Comece uma live para ganhar seguidores e moedas";
    }
  }

  function atualizarHUD() {
    verificarNivel();

    elSeguidores.textContent = seguidores;
    elMoedas.textContent = moedas;

    const n = nivelAtual();
    elNivelNum.textContent = `${estaVerificado() ? "✅" : "⭐"} ${n.nivel}`;
    const proximo = niveis[n.nivel];
    elNivelFaltam.textContent = proximo ? `faltam ${proximo.seg - seguidores}` : "nível máximo";

    const espectadores = aoVivo ? Math.max(1, Math.round(seguidores * 0.3)) : 0;
    chatTopo.textContent = `${aoVivo ? "🔴 AO VIVO · " : ""}💬 Chat · 👀 ${espectadores}`;
    chatTopo.style.color = aoVivo ? "#ff8a80" : "white";

    atualizarTextoGanho();
    atualizarLoja();
    atualizarCategorias();
  }

  // ===== Controles =====
  window.addEventListener("keydown", (e) => {
    const tecla = e.key.toLowerCase();
    if (["arrowup", "arrowdown", "arrowleft", "arrowright"].includes(tecla)) {
      e.preventDefault();
    }
    if (tecla === "e" && !e.repeat) acao();
    if (tecla === "m" && !e.repeat && !modalAtual) abrirModal("minigamePainel");
    if (tecla === "escape" && modalAtual) fecharModal();
    teclas[tecla] = true;
  });

  window.addEventListener("keyup", (e) => {
    teclas[e.key.toLowerCase()] = false;
  });

  window.addEventListener("blur", zerarControles);

  document.querySelectorAll("[data-dir]").forEach((botao) => {
    const dir = botao.dataset.dir;
    botao.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      controle[dir] = true;
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach((evento) => {
      botao.addEventListener(evento, () => {
        controle[dir] = false;
      });
    });
  });

  // Girar a câmera arrastando o dedo (ou o mouse) na tela
  renderer.domElement.addEventListener("pointerdown", (e) => {
    arrastando = true;
    ultimoX = e.clientX;
  });
  window.addEventListener("pointermove", (e) => {
    if (!arrastando || modalAtual) return;
    yaw -= (e.clientX - ultimoX) * 0.01;
    ultimoX = e.clientX;
  });
  window.addEventListener("pointerup", () => { arrastando = false; });
  window.addEventListener("pointercancel", () => { arrastando = false; });

  btnAcao.addEventListener("click", () => {
    tocar("clique");
    acao();
  });
  document.querySelectorAll("[data-fechar]").forEach((b) => b.addEventListener("click", fecharModal));
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  // Salvar ao sair da página
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) salvarJogo();
  });
  window.addEventListener("pagehide", salvarJogo);

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ===== Loop principal =====
  let anterior = performance.now();
  let tempo = 0;
  let ultimoTexto = 0;

  function loop(agora) {
    const dt = Math.min((agora - anterior) / 1000, 0.05);
    anterior = agora;
    tempo += dt;

    const andando = modalAtual ? false : moverJogador(dt);
    animarBoneco(jogador, andando, tempo);
    atualizarCamera(dt);
    atualizarZona();

    // Atualiza o texto de ganhos quando você muda de rua para casa
    if (tempo - ultimoTexto > 0.5) {
      atualizarTextoGanho();
      ultimoTexto = tempo;
    }

    renderer.render(cena, camera);
    requestAnimationFrame(loop);
  }

  // ===== Inicialização =====
  criarCartoesLoja();
  criarCartoesCategoria();
  const carregou = carregarJogo();
  aplicarCenario(cenarioAtual);
  desenharEquipamentos();
  adicionarChat(carregou ? "Bem-vindo de volta! 👋" : "Chat offline. Comece uma live!", "sistema");
  if (carregou) mostrarAviso("Bem-vindo de volta! Seu progresso foi carregado.");
  atualizarHUD();
  if (!tutorialVisto) abrirTutorial();
  setInterval(salvarJogo, 5000);
  requestAnimationFrame(loop);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
