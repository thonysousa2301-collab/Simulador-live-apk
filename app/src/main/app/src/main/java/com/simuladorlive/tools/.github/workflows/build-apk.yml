name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Copiar o jogo para dentro do APK
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - name: Gerar o ícone do app
        run: python3 tools/gerar_icone.py

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 34 e build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Montar o APK
        run: gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Guardar o APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: simulador-live-apk
          path: app/build/outputs/apk/debug/app-debug.apk
